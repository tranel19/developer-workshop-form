<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Workshop Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h1>Developer Workshop Registration</h1>
        <form id="registration-form" action="#" method="POST">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your Full Name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="experience">Experience Level</label>
                <select id="experience" name="experience" required>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
            </div>

            <div class="form-group">
                <span class="group-title">Workshop Track</span>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="track-frontend" name="track" value="frontend" checked>
                        <label for="track-frontend">Frontend Web</label>
                    </div>

                    <div class="radio-option">
                        <input type="radio" id="track-backend" name="track" value="backend" checked>
                        <label for="track-backend">Backend APIs</label>
                    </div>

                    <div class="radio-option">
                        <input type="radio" id="track-ui/ux" name="track" value="ui/ux" checked>
                        <label for="track-ui/ux">UI/UX Design</label>
                    </div>

                </div>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="notifications" name="notifications" value="yes" >
                <label for="notifications">I agree to receive event updates</label>
            </div>

            <button type="submit">Register for Workshop</button>

        </form>
    </div>
</body>
</html>
